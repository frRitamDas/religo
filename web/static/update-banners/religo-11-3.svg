<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ReliGo 11.3</title>
  <desc id="desc">A dark blue and violet release graphic for ReliGo 11.3, featuring luminous abstract server rails and a refreshed digital experience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b19"/>
      <stop offset=".5" stop-color="#111b3c"/>
      <stop offset="1" stop-color="#25154a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70e1ff"/>
      <stop offset=".52" stop-color="#8b9bff"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f9" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#9ba7ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#726dff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#726dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g transform="translate(0 60)">
  <circle cx="920" cy="240" r="270" fill="url(#halo)"/>
  <circle cx="930" cy="250" r="138" fill="none" stroke="#a6a6ff" stroke-opacity=".14" stroke-width="1"/>
  <circle cx="930" cy="250" r="185" fill="none" stroke="#76e5ff" stroke-opacity=".11" stroke-width="1"/>
  <circle cx="930" cy="250" r="230" fill="none" stroke="#d08cff" stroke-opacity=".09" stroke-width="1"/>
  <g opacity=".72" transform="translate(760 112) rotate(-20 170 155)">
    <rect x="25" y="22" width="320" height="220" rx="28" fill="#101a37" stroke="url(#glow)" stroke-opacity=".75" stroke-width="2"/>
    <rect x="48" y="48" width="274" height="44" rx="12" fill="#1a2850" stroke="#83cfff" stroke-opacity=".6"/>
    <circle cx="71" cy="70" r="5" fill="#79e7ff"/>
    <circle cx="90" cy="70" r="5" fill="#a5a7ff"/>
    <rect x="111" y="65" width="126" height="10" rx="5" fill="url(#rail)"/>
    <rect x="48" y="111" width="274" height="44" rx="12" fill="#1a2850" stroke="#a99bff" stroke-opacity=".58"/>
    <circle cx="71" cy="133" r="5" fill="#9eabff"/>
    <circle cx="90" cy="133" r="5" fill="#d49dff"/>
    <rect x="111" y="128" width="173" height="10" rx="5" fill="url(#rail)"/>
    <rect x="48" y="174" width="274" height="44" rx="12" fill="#1a2850" stroke="#c28fff" stroke-opacity=".5"/>
    <circle cx="71" cy="196" r="5" fill="#c59cff"/>
    <circle cx="90" cy="196" r="5" fill="#84dfff"/>
    <rect x="111" y="191" width="148" height="10" rx="5" fill="url(#rail)"/>
  </g>
  <g fill="none" stroke="url(#glow)" stroke-linecap="round">
    <path d="M705 88h-70a19 19 0 0 0-19 19v20" stroke-width="3" stroke-opacity=".75"/>
    <path d="M728 364h-94a21 21 0 0 1-21-21v-23" stroke-width="3" stroke-opacity=".45"/>
    <path d="M1017 82h58a18 18 0 0 1 18 18v30" stroke-width="3" stroke-opacity=".45"/>
    <path d="M1057 391v20a18 18 0 0 1-18 18h-75" stroke-width="3" stroke-opacity=".65"/>
  </g>
  <g fill="#c9dcff">
    <circle cx="614" cy="126" r="4"/><circle cx="613" cy="319" r="4"/>
    <circle cx="1093" cy="131" r="4"/><circle cx="964" cy="429" r="4"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="78" y="120" fill="#a7eaff" font-size="19" font-weight="700" letter-spacing="5">THE NEW RELEASE</text>
    <text x="74" y="223" fill="#ffffff" font-size="92" font-weight="800" letter-spacing="-4">ReliGo</text>
    <text x="80" y="281" fill="url(#glow)" font-size="48" font-weight="750" letter-spacing="1">11.3</text>
    <rect x="80" y="313" width="76" height="4" rx="2" fill="url(#glow)"/>
    <text x="80" y="362" fill="#eef3ff" font-size="25" font-weight="650">RENEWED API. UPGRADED SERVERS.</text>
    <text x="80" y="402" fill="#b9c6e9" font-size="20" font-weight="500">A clearer, smoother ReliGo experience.</text>
    <text x="80" y="467" fill="#8596c0" font-size="15" font-weight="600" letter-spacing="2">WEB 11.3  ·  API 11.3  ·  RITAM DAS</text>
  </g>
  </g>
</svg>